services:
  opencode:
    build:
      context: .
      dockerfile: opencode_app/Dockerfile
      args:
        # v2 binary via the scoped @opencode/cli package (v1-only opencode-ai
        # silently ignored the v2 plugins key — #387).
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.0.3}
    container_name: opencode
    env_file: .env
    ports:
      - "${OPENCODE_PORT:-4097}:4096"
    volumes:
      - opencode-data:/home/opencode/.local/share/opencode
      # Goal plugin state (#387): survives container recreation.
      - goal-state:/home/opencode/.local/share/opencode-goal-plugin
      - ${WORKSPACE_DIR:-~/Projects}:/workspace
      - ~/.ssh:/tmp/ssh-host:ro
      - npm-cache:/home/opencode/.npm
      - pip-cache:/home/opencode/.cache/pip
    restart: unless-stopped
    healthcheck:
      # Liveness + goal-plugin presence (#387). v2 mandates HTTP auth on every
      # route, so authenticate with the password materialized by the entrypoint
      # (set OPENCODE_SERVER_PASSWORD in .env to choose your own; otherwise it
      # is generated and printed once in `docker logs opencode`). The grep is
      # deliberately precise: a bare `grep goal` false-positives on the word
      # "/goal" inside OTHER command descriptions (run-plan's mentions it) and
      # certified an inert container as healthy. Absence of the actual goal
      # command marks the container unhealthy — inertness is loud.
      test: ["CMD-SHELL", "curl -sf -u \"opencode:$(cat /home/opencode/.local/share/opencode/server-password 2>/dev/null)\" http://localhost:4096/api/command | grep -q '\"name\":\"goal\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous start period: the goal plugin npm-fetches asynchronously and
      # /api/command serves 200 before registration completes (observed ~30-60s
      # cold; failures during start_period don't count toward unhealthy).
      start_period: 60s

  llm-server:
    profiles: ["llm"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: opencode-llm-server
    ports:
      - "${LLM_PORT:-17851}:8080"
    volumes:
      - ${LOCAL_LLM_MODEL_PATH:-~/.local/share/opencode/models}:/models:ro
    environment:
      - MODEL_PATH=/models/${LLM_MODEL:-gemma-4-E4B_q4_0-it.gguf}
      - MMPROJ_PATH=/models/${LLM_MMPROJ:-gemma-4-E4B-it-mmproj.gguf}
      - HOST=0.0.0.0
      - PORT=8080
      - N_GPU_LAYERS=${N_GPU_LAYERS:-999}
      - CTX_SIZE=${CTX_SIZE:-100000}
    command: >
      -m /models/${LLM_MODEL:-gemma-4-E4B_q4_0-it.gguf}
      --mmproj /models/${LLM_MMPROJ:-gemma-4-E4B-it-mmproj.gguf}
      --host 0.0.0.0
      --port 8080
      -ngl ${N_GPU_LAYERS:-999}
      -c ${CTX_SIZE:-100000}
      --jinja
      --verbose
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  vllm-server:
    profiles: ["vllm"]
    image: vllm/vllm-openai:latest
    container_name: opencode-vllm-server
    ports:
      - "${VLLM_PORT:-17852}:8000"
    volumes:
      - ${VLLM_MODEL_PATH:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - MODEL_NAME=${VLLM_MODEL:-google/gemma-4-E4B-it-qat-w4a16-ct}
      - HF_HOME=/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model ${VLLM_MODEL:-google/gemma-4-E4B-it-qat-w4a16-ct}
      --host 0.0.0.0
      --port 8000
      --max-model-len ${VLLM_MAX_MODEL_LEN:-100000}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTIL:-0.99}
    restart: unless-stopped

  docling-serve:
    profiles: ["docling"]
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: opencode-docling
    ports:
      - "${DOCLING_PORT:-8751}:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=1
    volumes:
      - docling-cache:/root/.cache/docling
    restart: unless-stopped

volumes:
  opencode-data:
  goal-state:
  npm-cache:
  pip-cache:
  docling-cache:
